name: Skill Quality Gate

on:
  pull_request:
    paths:
      - 'plugins/**/skills/**/SKILL.md'
      - 'plugins/**/skills/**/*.html'
      - 'plugins/**/skills/**/*.md'
      - 'plugins/**/skills/**/scripts/**'
      - 'plugins/**/skills/**/references/**'
      - 'scripts/rubric.md'
      - 'scripts/score_skill.py'
      - '.github/workflows/skill-quality-gate.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: skill-quality-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Evaluate skills (90+ required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed SKILL.md files
        id: changes
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # --no-renames: rename 을 (delete + add) 로 분해해서 새 경로가 'A' 로 잡히게 함.
          # 이렇게 안 하면 git 의 rename 감지가 작동해 A/M 필터에서 누락됨 (기존 PR #3 사례).
          mapfile -t FILES < <(git diff --no-renames --name-only --diff-filter=AM "${BASE_SHA}" "${HEAD_SHA}" -- 'plugins/**/skills/**/SKILL.md')
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "변경된 SKILL.md 없음 — 게이트 스킵"
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
          else
            printf '변경된 스킬 (%d개):\n' "${#FILES[@]}"
            printf '  %s\n' "${FILES[@]}"
            echo "files=${FILES[*]}" >> "$GITHUB_OUTPUT"
            echo "count=${#FILES[@]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.changes.outputs.count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Score skills (heuristic, stdlib only — no API key)
        if: steps.changes.outputs.count != '0'
        env:
          SKILL_EVAL_PASS_SCORE: '90'
          SKILL_EVAL_OUTPUT: 'evaluation-results.json'
        run: |
          set -euo pipefail
          read -r -a FILES <<< "${{ steps.changes.outputs.files }}"
          python3 scripts/score_skill.py "${FILES[@]}" | tee evaluation-output.txt

      - name: Upload evaluation artifact
        if: always() && steps.changes.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: skill-evaluation-results
          path: |
            evaluation-results.json
            evaluation-output.txt
          retention-days: 30

      - name: Comment on PR with results
        if: always() && steps.changes.outputs.count != '0' && hashFiles('evaluation-results.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('evaluation-results.json', 'utf-8'));
            const passScore = data.pass_score;
            const allPass = data.all_pass;

            let body = `## 🎯 Skill Quality Gate Result\n\n`;
            body += `**통과 기준**: ${passScore}/100  •  **최종**: ${allPass ? '✅ PASS — 병합 가능' : '❌ FAIL — 개선 후 재제출'}\n\n`;
            body += `_채점 방식_: stdlib 휴리스틱 (LLM 호출 없음, 외부 API 키 불필요, 결정적)\n\n`;

            for (const r of data.results) {
              if (r.error) {
                body += `### ❌ \`${r.path}\` — 평가 실패\n\n\`\`\`\n${r.error}\n\`\`\`\n\n`;
                continue;
              }
              const icon = r.verdict === 'PASS' ? '✅' : '❌';
              body += `### ${icon} \`${r.path}\` — ${r.total}/100 (${r.verdict})\n\n`;
              body += `> ${r.summary}\n\n`;
              body += `| # | 축 | 점수 | 사유 |\n|---|---|---|---|\n`;
              for (const ax of r.axes) {
                const reason = (ax.reason || '').replace(/\|/g, '\\|');
                body += `| ${ax.id} | ${ax.name} | ${ax.score}/${ax.max} | ${reason} |\n`;
              }
              if (r.top_improvements && r.top_improvements.length) {
                body += `\n**점수 상승 포인트 (Top improvements)**:\n`;
                for (const imp of r.top_improvements) body += `- ${imp}\n`;
              }
              body += `\n`;
            }
            body += `\n---\n_루브릭_: [\`scripts/rubric.md\`](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/scripts/rubric.md) • _채점 스크립트_: [\`scripts/score_skill.py\`](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/scripts/score_skill.py)\n`;

            // 동일 PR 의 기존 게이트 코멘트 찾아서 업데이트, 없으면 신규 작성
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '## 🎯 Skill Quality Gate Result';

            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
