name: Skill Quality Gate

on:
  pull_request:
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'docs/**/*.md'
      - 'plugins/**/skills/**/SKILL.md'
      - 'plugins/**/skills/**/*.html'
      - 'plugins/**/skills/**/*.md'
      - 'plugins/**/skills/**/scripts/**'
      - 'plugins/**/skills/**/references/**'
      - 'scripts/rubric.md'
      - 'scripts/score_skill.py'
      - '.github/workflows/skill-quality-gate.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: skill-quality-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Evaluate skills (90+ required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed SKILL.md files
        id: changes
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # --no-renames: decompose a rename into (delete + add) so the new path is captured as 'A'.
          # Without this, git's rename detection would hide the change from the A/M filter (the PR #3 incident).
          mapfile -t FILES < <(git diff --no-renames --name-only --diff-filter=AM "${BASE_SHA}" "${HEAD_SHA}" -- 'plugins/**/skills/**/SKILL.md')
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No changed SKILL.md — gate skipped"
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
          else
            printf 'Changed skills (%d):\n' "${#FILES[@]}"
            printf '  %s\n' "${FILES[@]}"
            echo "files=${FILES[*]}" >> "$GITHUB_OUTPUT"
            echo "count=${#FILES[@]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.changes.outputs.count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Score skills (heuristic, stdlib only — no API key)
        if: steps.changes.outputs.count != '0'
        env:
          SKILL_EVAL_PASS_SCORE: '90'
          SKILL_EVAL_OUTPUT: 'evaluation-results.json'
        run: |
          set -euo pipefail
          read -r -a FILES <<< "${{ steps.changes.outputs.files }}"
          python3 scripts/score_skill.py "${FILES[@]}" | tee evaluation-output.txt

      - name: Upload evaluation artifact
        if: always() && steps.changes.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: skill-evaluation-results
          path: |
            evaluation-results.json
            evaluation-output.txt
          retention-days: 30

      - name: Comment on PR with results
        if: always() && steps.changes.outputs.count != '0' && hashFiles('evaluation-results.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('evaluation-results.json', 'utf-8'));
            const passScore = data.pass_score;
            const allPass = data.all_pass;

            let body = `## 🎯 Skill Quality Gate Result\n\n`;
            body += `**Pass threshold**: ${passScore}/100  •  **Verdict**: ${allPass ? '✅ PASS — mergeable' : '❌ FAIL — please improve and re-submit'}\n\n`;
            body += `_Scoring_: stdlib heuristic (no LLM, no external API key, deterministic)\n\n`;

            for (const r of data.results) {
              if (r.error) {
                body += `### ❌ \`${r.path}\` — evaluation failed\n\n\`\`\`\n${r.error}\n\`\`\`\n\n`;
                continue;
              }
              const icon = r.verdict === 'PASS' ? '✅' : '❌';
              body += `### ${icon} \`${r.path}\` — ${r.total}/100 (${r.verdict})\n\n`;
              body += `> ${r.summary}\n\n`;
              body += `| # | Axis | Score | Reason |\n|---|---|---|---|\n`;
              for (const ax of r.axes) {
                const reason = (ax.reason || '').replace(/\|/g, '\\|');
                body += `| ${ax.id} | ${ax.name} | ${ax.score}/${ax.max} | ${reason} |\n`;
              }
              if (r.top_improvements && r.top_improvements.length) {
                body += `\n**Top improvements**:\n`;
                for (const imp of r.top_improvements) body += `- ${imp}\n`;
              }
              body += `\n`;
            }
            body += `\n---\n_Rubric_: [\`scripts/rubric.md\`](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/scripts/rubric.md) • _Scorer_: [\`scripts/score_skill.py\`](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/scripts/score_skill.py)\n`;

            // Update existing gate comment on this PR; create one if absent.
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '## 🎯 Skill Quality Gate Result';

            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
