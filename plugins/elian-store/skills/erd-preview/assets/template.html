<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERD 계보 추적기 — {{TITLE}}</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eef1f6;color:#1f2937;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;}
  a{color:#1c4ed8;text-decoration:none;}
  a:hover{color:#123bb0;text-decoration:underline;}
  ::selection{background:#dbeafe;}
  @keyframes dashflow{to{stroke-dashoffset:-22;}}
  .mono{font-family:ui-monospace,'SFMono-Regular',Menlo,'JetBrains Mono',monospace;}
  #a-diagram::-webkit-scrollbar,.scrolly::-webkit-scrollbar{height:10px;width:10px;}
  #a-diagram::-webkit-scrollbar-thumb,.scrolly::-webkit-scrollbar-thumb{background:#cbd3df;border-radius:6px;}
</style>
</head>
<body>
<div style="max-width:1440px;margin:0 auto;padding:34px 40px 80px;">

  <header style="margin-bottom:22px;">
    <div class="mono" style="font-size:12px;letter-spacing:.14em;color:#1c4ed8;font-weight:700;">{{HEADER_TAG}}</div>
    <h1 style="font-size:28px;font-weight:900;margin:8px 0 8px;letter-spacing:-.02em;">계보 추적기 <span style="color:#8891a0;font-weight:700;font-size:18px;">Lineage Explorer</span></h1>
    <p style="margin:0;color:#5b6472;font-size:14.5px;line-height:1.6;max-width:900px;">{{SUBTITLE}}</p>
  </header>

  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;">
    <span style="font-size:12px;color:#8891a0;font-weight:600;">빠른 예시</span>
    {{QUICKCHIPS}}
    <button id="a-reset" style="margin-left:auto;font-family:inherit;font-size:12.5px;font-weight:600;color:#1c4ed8;background:#eef3ff;border:1px solid #c9d8ff;border-radius:9px;padding:8px 14px;cursor:pointer;">선택 해제</button>
  </div>

  <div style="display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;">

    <!-- 다이어그램 -->
    <div style="flex:1;min-width:600px;background:#fff;border:1px solid #d7dce4;border-radius:16px;padding:20px 22px 24px;box-shadow:0 8px 34px rgba(15,23,42,.06);">
      <div id="a-hint" style="margin:0 0 14px;font-size:13px;color:#1c4ed8;background:#eef3ff;border:1px dashed #b9caf5;border-radius:10px;padding:11px 14px;">🖱️ 아래 표에서 <b>행을 하나 클릭</b>하거나 위 <b>빠른 예시</b>를 눌러보세요.</div>
      <div id="a-viewport" style="position:relative;height:600px;overflow:hidden;background:#f7f9fc;border:1px solid #e6ebf2;border-radius:12px;cursor:grab;touch-action:none;user-select:none;">
        <div style="position:absolute;top:12px;right:12px;z-index:20;display:flex;flex-direction:column;gap:6px;">
          <button id="a-zin" style="width:34px;height:34px;font-size:18px;font-weight:700;background:#fff;border:1px solid #d0d6e0;border-radius:8px;cursor:pointer;color:#334155;box-shadow:0 1px 3px rgba(0,0,0,.08);">+</button>
          <button id="a-zout" style="width:34px;height:34px;font-size:18px;font-weight:700;background:#fff;border:1px solid #d0d6e0;border-radius:8px;cursor:pointer;color:#334155;box-shadow:0 1px 3px rgba(0,0,0,.08);">−</button>
          <button id="a-fit" title="전체 보기" style="width:34px;height:34px;font-size:15px;background:#fff;border:1px solid #d0d6e0;border-radius:8px;cursor:pointer;color:#334155;box-shadow:0 1px 3px rgba(0,0,0,.08);">⤢</button>
        </div>
        <div id="a-zoom-label" style="position:absolute;bottom:12px;right:14px;z-index:20;font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;color:#64748b;background:rgba(255,255,255,.85);border:1px solid #e2e6ee;border-radius:6px;padding:3px 8px;">100%</div>
        <div style="position:absolute;bottom:12px;left:14px;z-index:20;font-size:11px;color:#94a0b0;background:rgba(255,255,255,.85);border:1px solid #e2e6ee;border-radius:6px;padding:3px 8px;">드래그: 이동 · 휠/버튼: 확대·축소</div>
        <div id="a-pan" style="position:absolute;top:0;left:0;transform-origin:0 0;">
          <div id="a-diagram" style="position:relative;width:max-content;padding:44px 52px;">
            <svg id="a-wires" style="position:absolute;top:0;left:0;pointer-events:none;overflow:visible;z-index:1;"></svg>
            <div id="a-cols" style="position:relative;z-index:2;display:flex;gap:64px;align-items:center;"></div>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:#6b7280;margin-top:16px;align-items:center;">
        <span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:26px;height:0;border-top:3px solid #1c4ed8;"></span> 하드 FK</span>
        <span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:26px;height:0;border-top:3px dashed #9aa3b2;"></span> 소프트 참조 (스키마 FK 아님)</span>
        <span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:14px;height:14px;border-radius:4px;background:#c7dbff;border:1px solid #1c4ed8;"></span> 선택한 행</span>
        <span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:14px;height:14px;border-radius:4px;background:#eef3ff;border:1px solid #93b4f5;"></span> 계보에 포함</span>
      </div>
    </div>

    <!-- 요약 패널 -->
    <aside style="width:352px;flex:none;position:sticky;top:20px;background:#fff;border:1px solid #d7dce4;border-radius:16px;box-shadow:0 8px 34px rgba(15,23,42,.06);overflow:hidden;">
      <div style="background:#0f172a;color:#e2e8f0;padding:15px 18px;">
        <div class="mono" style="font-size:11px;color:#93b4f5;font-weight:700;letter-spacing:.08em;">RECORD LINEAGE</div>
        <div id="a-sum-title" style="font-size:16px;font-weight:800;color:#f8fafc;margin-top:4px;">레코드를 선택하세요</div>
      </div>
      <div id="a-summary" style="padding:16px 18px;font-size:13px;color:#5b6472;line-height:1.6;">
        표에서 행을 클릭하면 이 레코드의 <b>출처(상위 계보)</b>와 <b>영향(하위 계보)</b>이 순서대로 여기에 정리됩니다.
      </div>
    </aside>

  </div>
</div>

<script>
/* ── 데이터 구조 — 이 스킬이 채우는 유일한 부분. 아래 렌더 엔진은 손대지 않는다 ────────
   SCHEMA  : 테이블+컬럼. {c:'컬럼',t:'타입',pk:1?,fk:1?}
   RELS    : 관계. {from:[테이블,컬럼], to:[테이블,컬럼], card:'N:1', color:'#hex', soft:true?}
             soft:true = 스키마 FK 아닌 논리적 참조(점선). to 컬럼이 PK 아닐 수 있음.
   DATA    : 테이블당 실제 행. {cols:[...], rows:[[...],...]}. 첫 컬럼 = PK/식별자.
   LAYERS  : 좌→우 계층. 부모(참조 대상) 테이블이 앞 레이어. 한 레이어에 여러 테이블 가능.
   KLABEL  : 테이블명 → 한글 라벨(요약 패널·박스용).
   ─────────────────────────────────────────────────────────────────────────────── */
const SCHEMA = {{SCHEMA}};
const RELS = {{RELS}};
const DATA = {{DATA}};
const LAYERS = {{LAYERS}};
const KLABEL = {{KLABEL}};

// ── 렌더 엔진 (고정 — 수정 금지) ────────────────────────────────────────────────
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

class ERD {
  constructor(){ this.SCHEMA=SCHEMA; this.RELS=RELS; this.DATA=DATA; this.LAYERS=LAYERS; this.KLABEL=KLABEL; }

  buildDiagram(){
    const cols = LAYERS.map(names => {
      const tables = names.map(n => {
        const d = DATA[n];
        const header = `<div style="background:#f3f5f9;color:#334155;font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:12px;padding:8px 11px;border-bottom:1px solid #e2e6ee;white-space:nowrap;">${esc(n)}</div>`;
        const colhdr = `<div style="display:flex;font-size:11px;color:#94a0b0;font-weight:600;background:#fafbfd;">` +
          d.cols.map(c => `<div style="padding:5px 10px;white-space:nowrap;font-family:ui-monospace,Menlo,monospace;">${esc(c)}</div>`).join('') + `</div>`;
        const rows = d.rows.map(r => {
          const id = r[0];
          const cells = d.cols.map((c,i) => { const v=r[i]; return `<div style="padding:7px 10px;font-size:12px;white-space:nowrap;font-family:ui-monospace,Menlo,monospace;">${v===""?"∅":esc(v)}</div>`; }).join('');
          return `<div id="a-row-${esc(n)}-${esc(id)}" data-table="${esc(n)}" data-id="${esc(id)}" style="display:flex;border-top:1px solid #eef1f6;cursor:pointer;transition:background .12s,opacity .18s,box-shadow .18s;">${cells}</div>`;
        }).join('');
        return `<div id="a-box-${esc(n)}" style="border:1.5px solid #c7ccd6;border-radius:11px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:opacity .18s;">${header}${colhdr}${rows}</div>`;
      }).join('');
      return `<div style="display:flex;flex-direction:column;gap:24px;">${tables}</div>`;
    }).join('');
    document.getElementById('a-cols').innerHTML = cols;
  }

  ci(tbl,col){ return this.DATA[tbl].cols.indexOf(col); }
  rowVals(tbl,id){ return this.DATA[tbl].rows.find(r=>String(r[0])===String(id)); }
  layerIndex(name){ return this.LAYERS.findIndex(l=>l.indexOf(name)>=0); }

  mount(){
    this.buildDiagram();
    this.zoom=1; this.panX=0; this.panY=0;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ this.wireA(); this.wireZoom(); this.initView(); }));
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ this.redrawA(); this.initView(); });
    window.addEventListener('resize', ()=>this.redrawA());
  }

  applyTransform(){
    const pan=document.getElementById('a-pan'); if(pan) pan.style.transform=`translate(${this.panX}px,${this.panY}px) scale(${this.zoom})`;
    const lb=document.getElementById('a-zoom-label'); if(lb) lb.textContent=Math.round(this.zoom*100)+'%';
  }
  setZoom(nz, cx, cy){
    nz=Math.max(0.25, Math.min(2.5, nz));
    const vp=document.getElementById('a-viewport'); if(!vp) return;
    if(cx==null){ cx=vp.clientWidth/2; cy=vp.clientHeight/2; }
    const k=nz/this.zoom;
    this.panX = cx-(cx-this.panX)*k;
    this.panY = cy-(cy-this.panY)*k;
    this.zoom=nz; this.applyTransform();
  }
  fit(){
    const vp=document.getElementById('a-viewport'), dg=document.getElementById('a-diagram');
    if(!vp||!dg) return;
    const vw=vp.clientWidth, vh=vp.clientHeight, cw=dg.offsetWidth, ch=dg.offsetHeight;
    if(!cw||!ch) return;
    this.zoom=Math.min(Math.min(vw/cw, vh/ch)*0.94, 1.4);
    this.panX=(vw-cw*this.zoom)/2; this.panY=(vh-ch*this.zoom)/2;
    this.applyTransform();
  }
  initView(){
    const vp=document.getElementById('a-viewport'), dg=document.getElementById('a-diagram');
    if(!vp||!dg) return;
    const vw=vp.clientWidth, vh=vp.clientHeight, cw=dg.offsetWidth, ch=dg.offsetHeight;
    if(!cw||!ch) return;
    this.zoom=Math.max(0.5, Math.min(vh/ch*0.92, 1));
    this.panX = (cw*this.zoom <= vw) ? (vw-cw*this.zoom)/2 : 28;
    this.panY = (vh-ch*this.zoom)/2;
    this.applyTransform();
  }
  wireZoom(){
    const vp=document.getElementById('a-viewport'); if(!vp) return;
    document.getElementById('a-zin').addEventListener('click',()=>this.setZoom(this.zoom*1.25));
    document.getElementById('a-zout').addEventListener('click',()=>this.setZoom(this.zoom/1.25));
    document.getElementById('a-fit').addEventListener('click',()=>this.fit());
    vp.addEventListener('wheel',e=>{ e.preventDefault(); const r=vp.getBoundingClientRect(); const dir=e.deltaY<0?1.12:1/1.12; this.setZoom(this.zoom*dir, e.clientX-r.left, e.clientY-r.top); }, {passive:false});
    vp.addEventListener('pointerdown',e=>{ this._panning=true; this._panned=false; this._sx=e.clientX; this._sy=e.clientY; this._opx=this.panX; this._opy=this.panY; vp.style.cursor='grabbing'; });
    window.addEventListener('pointermove', e=>{ if(!this._panning) return; const dx=e.clientX-this._sx, dy=e.clientY-this._sy; if(Math.abs(dx)+Math.abs(dy)>4) this._panned=true; this.panX=this._opx+dx; this.panY=this._opy+dy; this.applyTransform(); });
    window.addEventListener('pointerup', ()=>{ this._panning=false; vp.style.cursor='grab'; });
  }

  clearSvg(svg, host){
    svg.innerHTML='';
    svg.setAttribute('width', host.offsetWidth);
    svg.setAttribute('height', host.offsetHeight);
    const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
    svg.appendChild(defs); svg._defs=defs; svg._n=0;
  }
  arrow(svg,color){
    const id=svg.id+'-mk'+(svg._n++);
    const m=document.createElementNS('http://www.w3.org/2000/svg','marker');
    m.setAttribute('id',id); m.setAttribute('markerWidth','9'); m.setAttribute('markerHeight','9');
    m.setAttribute('refX','7'); m.setAttribute('refY','3'); m.setAttribute('orient','auto');
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M0,0 L8,3 L0,6 Z'); p.setAttribute('fill',color);
    m.appendChild(p); svg._defs.appendChild(m); return id;
  }
  conn(svg, host, aEl, bEl, opt){
    if(!aEl||!bEl) return;
    const z=this.zoom||1;
    const hr=host.getBoundingClientRect(), ar=aEl.getBoundingClientRect(), br=bEl.getBoundingClientRect();
    const ay=((ar.top-hr.top)+ar.height/2)/z, by=((br.top-hr.top)+br.height/2)/z;
    let sx,ex;
    if(ar.left>br.left){ sx=(ar.left-hr.left)/z; ex=(br.right-hr.left)/z; }
    else { sx=(ar.right-hr.left)/z; ex=(br.left-hr.left)/z; }
    const mx=(sx+ex)/2;
    const d=`M${sx},${ay} C${mx},${ay} ${mx},${by} ${ex},${by}`;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',d); path.setAttribute('fill','none');
    path.setAttribute('stroke',opt.color); path.setAttribute('stroke-width', opt.w||2.6);
    path.setAttribute('stroke-linecap','round');
    if(opt.soft){ path.setAttribute('stroke-dasharray','6 5'); path.style.animation='dashflow 1s linear infinite'; }
    path.setAttribute('marker-end','url(#'+this.arrow(svg,opt.color)+')');
    svg.appendChild(path);
    const lx=mx, ly=(ay+by)/2-8;
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.innerHTML=`<rect x="${lx-19}" y="${ly-11}" width="38" height="20" rx="5" fill="#fff" stroke="${opt.color}"/><text x="${lx}" y="${ly+3}" text-anchor="middle" font-size="11" font-weight="700" font-family="ui-monospace,Menlo,monospace" fill="${opt.color}">${opt.card}</text>`;
    svg.appendChild(g);
  }

  wireA(){
    this.aPinned=null;
    this._aRows=[...document.querySelectorAll('[id^="a-row-"]')];
    this._aRows.forEach(tr=>{
      tr.addEventListener('mouseenter',()=>{ if(!this.aPinned) tr.style.background='#f4f7ff'; });
      tr.addEventListener('mouseleave',()=>{ if(!this.aPinned) tr.style.background=''; });
      tr.addEventListener('click',()=>{ if(this._panned) return; this.pinA(tr.dataset.table, tr.dataset.id); });
    });
    document.getElementById('a-reset').addEventListener('click',()=>this.pinA(null));
    document.querySelectorAll('.qchip').forEach(c=>c.addEventListener('click',()=>this.pinA(c.dataset.t, c.dataset.id)));
  }

  lineage(tbl,id){
    const nodes=new Set(), edges=[]; const key=(t,i)=>t+'#'+i;
    const up=(t,i)=>{
      const vals=this.rowVals(t,i); if(!vals) return;
      this.RELS.filter(r=>r.from[0]===t).forEach(r=>{
        const fv=vals[this.ci(t,r.from[1])]; if(fv===''||fv==null) return;
        const pv=this.DATA[r.to[0]].rows.find(row=>String(row[this.ci(r.to[0],r.to[1])])===String(fv));
        if(!pv) return; const pk=key(r.to[0], pv[0]);
        edges.push({a:key(t,i), b:pk, rel:r, dir:'up'});
        if(!nodes.has(pk)){ nodes.add(pk); up(r.to[0], pv[0]); }
      });
    };
    const down=(t,i)=>{
      const vals=this.rowVals(t,i); if(!vals) return;
      this.RELS.filter(r=>r.to[0]===t).forEach(r=>{
        const targetVal=vals[this.ci(t, r.to[1])]; if(targetVal===''||targetVal==null) return;
        this.DATA[r.from[0]].rows.forEach(cr=>{
          const fv=cr[this.ci(r.from[0], r.from[1])];
          if(String(fv)===String(targetVal)){
            const ck=key(r.from[0], cr[0]);
            edges.push({a:ck, b:key(t,i), rel:r, dir:'down'});
            if(!nodes.has(ck)){ nodes.add(ck); down(r.from[0], cr[0]); }
          }
        });
      });
    };
    nodes.add(key(tbl,id)); up(tbl,id); down(tbl,id);
    const seen=new Set(), uniq=[];
    edges.forEach(e=>{ const k=e.a+'|'+e.b; if(!seen.has(k)){ seen.add(k); uniq.push(e); } });
    return {nodes, edges:uniq};
  }

  pinA(tbl,id){ this.aPinned = tbl?{tbl,id}:null; this.redrawA(); }

  describe(tbl,id){
    const v=this.rowVals(tbl,id); if(!v) return '';
    const d=this.DATA[tbl];
    const kl=this.KLABEL[tbl]||tbl;
    const parts=d.cols.slice(1,4).map(c=>{ const x=v[this.ci(tbl,c)]; return (x===''||x==null)?null:`${x}`; }).filter(Boolean);
    return parts.length?parts.join(' · '):kl;
  }

  redrawA(){
    const host=document.getElementById('a-diagram'); const svg=document.getElementById('a-wires');
    if(!host||!svg) return;
    this.clearSvg(svg, host);
    const rows=this._aRows||[];
    const hint=document.getElementById('a-hint');
    const sumT=document.getElementById('a-sum-title'); const sum=document.getElementById('a-summary');

    if(!this.aPinned){
      rows.forEach(tr=>{ tr.style.opacity=''; tr.style.background=''; tr.style.boxShadow=''; });
      document.querySelectorAll('[id^="a-box-"]').forEach(b=>b.style.opacity='');
      if(hint) hint.innerHTML='🖱️ 아래 표에서 <b>행을 하나 클릭</b>하거나 위 <b>빠른 예시</b>를 눌러보세요.';
      if(sumT) sumT.textContent='레코드를 선택하세요';
      if(sum) sum.innerHTML='표에서 행을 클릭하면 이 레코드의 <b>출처(상위 계보)</b>와 <b>영향(하위 계보)</b>이 순서대로 여기에 정리됩니다.';
      return;
    }

    const P=this.aPinned;
    const {nodes,edges}=this.lineage(P.tbl, P.id);
    const inSet=(t,i)=>nodes.has(t+'#'+i);
    document.querySelectorAll('[id^="a-box-"]').forEach(b=>{
      const name=b.id.slice(6);
      b.style.opacity=[...nodes].some(k=>k.startsWith(name+'#'))?'1':'.4';
    });
    rows.forEach(tr=>{
      const on=inSet(tr.dataset.table, tr.dataset.id);
      const self=tr.dataset.table===P.tbl && String(tr.dataset.id)===String(P.id);
      tr.style.opacity=on?'1':'.22';
      tr.style.background=self?'#c7dbff':(on?'#eef3ff':'');
      tr.style.boxShadow=self?'inset 3px 0 0 #1c4ed8':(on?'inset 3px 0 0 #93b4f5':'');
    });
    edges.forEach(e=>{
      const a=document.getElementById('a-row-'+e.a.replace('#','-'));
      const b=document.getElementById('a-row-'+e.b.replace('#','-'));
      this.conn(svg, host, a, b, {color:e.rel.soft?'#64748b':e.rel.color, soft:e.rel.soft, card:e.rel.card});
    });
    if(hint) hint.innerHTML=`추적 중: <b class="mono">${P.tbl} #${P.id}</b> · 연결된 레코드 <b>${nodes.size}건</b>. <span style="color:#64748b;">(다른 행 클릭 또는 ‘선택 해제’)</span>`;

    const softNodes=new Set();
    edges.forEach(e=>{ if(e.rel.soft){ softNodes.add(e.a); softNodes.add(e.b); } });
    const pinKey=P.tbl+'#'+P.id, pinLayer=this.layerIndex(P.tbl);
    const nodeArr=[...nodes].filter(k=>k!==pinKey).map(k=>{
      const [t,i]=k.split('#'); return {t,i,layer:this.layerIndex(t),key:k};
    });
    const ups=nodeArr.filter(n=>n.layer<pinLayer).sort((a,b)=>a.layer-b.layer);
    const downs=nodeArr.filter(n=>n.layer>=pinLayer).sort((a,b)=>a.layer-b.layer);
    const item=(n)=>{
      const soft=softNodes.has(n.key);
      const badge=soft?'<span style="font-size:9.5px;font-weight:700;color:#64748b;border:1px dashed #9aa3b2;border-radius:5px;padding:0 5px;margin-left:6px;">소프트</span>':'';
      return `<div style="display:flex;gap:10px;padding:9px 0;border-top:1px solid #eef1f6;">
        <div style="flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px;background:${soft?'#9aa3b2':'#1c4ed8'};"></div>
        <div style="min-width:0;">
          <div style="font-weight:700;color:#1f2937;font-size:12.5px;">${this.KLABEL[n.t]||n.t}${badge}</div>
          <div class="mono" style="font-size:11px;color:#94a0b0;">${n.t} #${n.i}</div>
          <div style="font-size:12px;color:#5b6472;margin-top:2px;">${this.describe(n.t,n.i)}</div>
        </div></div>`;
    };
    if(sumT) sumT.innerHTML=`${this.KLABEL[P.tbl]||P.tbl} <span class="mono" style="font-size:13px;color:#93b4f5;">#${P.id}</span>`;
    if(sum){
      let html=`<div style="background:#f7f9fc;border:1px solid #e6ebf2;border-radius:9px;padding:10px 12px;margin-bottom:12px;">
        <div class="mono" style="font-size:11px;color:#8891a0;">${P.tbl} #${P.id}</div>
        <div style="font-size:13px;color:#1f2937;margin-top:2px;font-weight:600;">${this.describe(P.tbl,P.id)}</div></div>`;
      html+=`<div style="font-size:11px;font-weight:700;letter-spacing:.06em;color:#8891a0;">▲ 출처 (상위 계보) · ${ups.length}</div>`;
      html+= ups.length? ups.map(item).join('') : '<div style="font-size:12px;color:#a3adba;padding:8px 0;">상위 참조 없음 (계보의 시작점)</div>';
      html+=`<div style="font-size:11px;font-weight:700;letter-spacing:.06em;color:#8891a0;margin-top:14px;">▼ 영향 (하위 계보) · ${downs.length}</div>`;
      html+= downs.length? downs.map(item).join('') : '<div style="font-size:12px;color:#a3adba;padding:8px 0;">하위 영향 없음 (말단 레코드)</div>';
      sum.innerHTML=html;
    }
  }
}

document.addEventListener('DOMContentLoaded', ()=>{ window._erd = new ERD(); window._erd.mount(); });
</script>
</body>
</html>
