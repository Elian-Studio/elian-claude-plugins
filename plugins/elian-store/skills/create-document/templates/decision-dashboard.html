<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{issue}} Decision Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --ink: #1d2430;
    --muted: #667085;
    --line: #d7dde6;
    --primary: #1f66d1;
    --primary-ink: #ffffff;
    --green: #14845f;
    --red: #b42318;
    --yellow: #b7791f;
    --blue: #2563eb;
    --shadow: 0 10px 32px rgba(16, 24, 40, .10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  button, textarea {
    font: inherit;
  }
  .shell {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    min-height: 100vh;
  }
  .nav {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: auto;
    padding: 24px 18px;
    border-right: 1px solid var(--line);
    background: #fff;
  }
  .nav-brand h1 {
    margin: 0;
    font-size: 22px;
  }
  .meta {
    display: grid;
    gap: 3px;
    margin-top: 8px;
    color: var(--muted);
    font-size: 13px;
  }
  .nav-group {
    margin-top: 26px;
  }
  .nav-group-label {
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .nav-link {
    display: grid;
    grid-template-columns: 26px 1fr 14px;
    gap: 8px;
    align-items: center;
    min-height: 44px;
    padding: 8px;
    border-radius: 8px;
    color: var(--ink);
    text-decoration: none;
  }
  .nav-link:hover,
  .nav-link.active {
    background: #eef4ff;
  }
  .pip {
    display: inline-grid;
    place-items: center;
    width: 24px;
    height: 24px;
    border-radius: 999px;
    color: #fff;
    font-size: 12px;
    font-weight: 800;
  }
  .pip-p0 { background: var(--red); }
  .pip-p1 { background: var(--yellow); }
  .pip-p2 { background: var(--blue); }
  .check-indicator.done {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: var(--green);
  }
  .nav-footer {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }
  .gauge-header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
  }
  .gauge-track {
    height: 8px;
    margin-top: 8px;
    overflow: hidden;
    border-radius: 999px;
    background: #edf1f6;
  }
  .gauge-fill {
    height: 100%;
    background: var(--primary);
  }
  .fmt-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 14px;
  }
  .fmt-opt,
  .btn-export,
  .btn-copy-json {
    min-height: 44px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }
  .fmt-opt.on,
  .btn-export.live,
  .btn-copy-json.live {
    border-color: var(--primary);
    background: var(--primary);
    color: var(--primary-ink);
  }
  .btn-export,
  .btn-copy-json {
    width: 100%;
    margin-top: 10px;
    padding: 8px 12px;
  }
  .btn-export:disabled,
  .btn-copy-json:disabled {
    cursor: not-allowed;
    opacity: .55;
  }
  .content {
    max-width: 920px;
    width: 100%;
    margin: 0 auto;
    padding: 34px 24px 88px;
  }
  .content-header {
    margin-bottom: 28px;
  }
  .content-header h2 {
    margin: 0;
    font-size: 30px;
    line-height: 1.2;
  }
  .content-header p {
    margin: 8px 0 0;
    color: var(--muted);
  }
  .pri-section {
    margin-top: 28px;
  }
  .pri-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .pri-tag {
    display: inline-flex;
    align-items: center;
    min-height: 30px;
    padding: 4px 10px;
    border-radius: 999px;
    color: #fff;
    font-size: 13px;
    font-weight: 800;
  }
  .pri-tag-p0 { background: var(--red); }
  .pri-tag-p1 { background: var(--yellow); }
  .pri-tag-p2 { background: var(--blue); }
  .pri-line {
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .card {
    margin: 14px 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .card-head {
    display: grid;
    grid-template-columns: 34px 1fr 20px;
    gap: 10px;
    align-items: center;
    min-height: 64px;
    padding: 14px 18px;
    cursor: pointer;
  }
  .card-num {
    display: inline-grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border-radius: 999px;
    background: #eef4ff;
    color: var(--primary);
    font-weight: 800;
  }
  .card-title {
    font-size: 18px;
    font-weight: 800;
  }
  .card-chevron {
    color: var(--muted);
    transition: transform .16s ease;
  }
  .card.open .card-chevron {
    transform: rotate(90deg);
  }
  .card-body {
    display: none;
    border-top: 1px solid var(--line);
  }
  .card.open .card-body {
    display: block;
  }
  .card-inner {
    display: grid;
    gap: 16px;
    padding: 18px;
  }
  .info-label,
  .choices-label {
    margin-bottom: 6px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .info-box {
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #f9fafb;
  }
  .box-judge {
    border-color: #bfdbfe;
    background: #eff6ff;
  }
  .opt-list {
    display: grid;
    gap: 10px;
  }
  .opt {
    display: grid;
    grid-template-columns: 18px 1fr auto;
    gap: 10px;
    align-items: center;
    min-height: 48px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    text-align: left;
    cursor: pointer;
  }
  .opt.picked {
    border-color: var(--primary);
    background: #eef4ff;
  }
  .circle {
    width: 16px;
    height: 16px;
    border: 2px solid var(--line);
    border-radius: 999px;
  }
  .opt.picked .circle {
    border-color: var(--primary);
    background: var(--primary);
  }
  .key {
    font-weight: 800;
  }
  .rec-badge {
    display: inline-flex;
    align-items: center;
    min-height: 26px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #ecfdf5;
    color: var(--green);
    font-size: 12px;
    font-weight: 800;
  }
  .memo textarea {
    width: 100%;
    min-height: 84px;
    margin-top: 10px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    resize: vertical;
  }
  .toast {
    position: fixed;
    right: 18px;
    bottom: 18px;
    display: none;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--ink);
    color: #fff;
    box-shadow: var(--shadow);
  }
  .toast.show { display: block; }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .nav {
      position: relative;
      height: auto;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
    .content { padding: 26px 18px 80px; }
  }
</style>
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="Decision navigation">
    <div class="nav-brand">
      <h1>{{issue}}</h1>
      <div class="meta">
        <span>{{branch}}</span>
        <span>{{date}}</span>
      </div>
    </div>

    <!-- FOREACH priority_groups -->
    <div class="nav-group">
      <div class="nav-group-label">{{label}}</div>
      <!-- FOREACH cards -->
      <a class="nav-link" href="#{{card_id}}" data-id="{{card_id}}">
        <span class="pip pip-{{priority}}">{{num}}</span>
        <span>{{title}}</span>
        <span class="check-indicator" id="ci-{{card_id}}"></span>
      </a>
      <!-- END -->
    </div>
    <!-- END -->

    <div class="nav-footer">
      <div class="gauge">
        <div class="gauge-header">
          <span class="gauge-label">Decision progress</span>
          <span class="gauge-count" id="g-count">0 / 0</span>
        </div>
        <div class="gauge-track">
          <div class="gauge-fill" id="g-fill" style="width:0%"></div>
        </div>
      </div>
      <div class="fmt-toggle">
        <button class="fmt-opt on" data-f="md">.md</button>
        <button class="fmt-opt" data-f="json">.json</button>
      </div>
      <button class="btn-export" id="btn-go" disabled>Loading...</button>
      <button class="btn-copy-json" id="btn-copy-json" disabled title="Copy JSON to clipboard without downloading a file">Copy JSON</button>
    </div>
  </nav>

  <main class="content">
    <div class="content-header">
      <h2>{{title}}</h2>
      <p>{{subtitle}}</p>
    </div>

    <!-- FOREACH priority_groups -->
    <section class="pri-section">
      <div class="pri-header">
        <span class="pri-tag pri-tag-{{priority}}">{{label}}</span>
        <span class="pri-line"></span>
      </div>
      <!-- FOREACH cards -->
      <div class="card{{open_class}}" id="{{card_id}}" data-key="{{card_id}}">
        <div class="card-head" onclick="toggleCard(this)">
          <span class="card-num">{{num}}</span>
          <div class="card-head-text"><div class="card-title">{{title}}</div></div>
          <span class="card-chevron">></span>
        </div>
        <div class="card-body">
          <div class="card-inner">
            <div class="info-block">
              <div class="info-label">Background</div>
              <div class="info-box box-context">
                {{background.situation}}
                {{background.pain}}
                {{background.divergence}}
              </div>
            </div>
            <div class="info-block">
              <div class="info-label">Judgment question</div>
              <div class="info-box box-judge">{{judgment_question}}</div>
            </div>
            <div class="choices">
              <div class="choices-label">Decision</div>
              <div class="opt-list" data-group="{{card_id}}">
                <!-- FOREACH options -->
                <button class="opt" data-val="{{key}}" onclick="pick(this)">
                  <span class="circle"></span>
                  <span><span class="key">{{key}}.</span> {{label}}</span>
                  {{{rec_badge}}}
                </button>
                <!-- END -->
                <button class="opt" data-val="D" onclick="pick(this)">
                  <span class="circle"></span>
                  <span><span class="key">D.</span> Other - write the reason in the memo below</span>
                </button>
              </div>
              <div class="memo">
                <textarea placeholder="Decision reason or supplemental memo" data-memo="{{card_id}}"></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- END -->
    </section>
    <!-- END -->
  </main>
</div>

<div class="toast" id="toast"><span id="toast-msg"></span></div>

<script>
  const state = {};
  const CARDS = Array.from(document.querySelectorAll('.card[data-key]'));
  const TOTAL = CARDS.length;
  const titles = {};
  const prios = {};
  const ISSUE_ID = '{{issue}}';
  const BRANCH = '{{branch}}';
  let fmt = 'md';

  CARDS.forEach(card => {
    const id = card.dataset.key;
    const num = card.querySelector('.card-num') ? card.querySelector('.card-num').textContent.trim() : '';
    const title = card.querySelector('.card-title') ? card.querySelector('.card-title').textContent.trim() : id;
    titles[id] = (num ? num + '. ' : '') + title;
    const pip = document.querySelector('.nav-link[data-id="' + id + '"] .pip');
    if (pip && pip.classList.contains('pip-p0')) prios[id] = 'P0';
    else if (pip && pip.classList.contains('pip-p1')) prios[id] = 'P1';
    else if (pip && pip.classList.contains('pip-p2')) prios[id] = 'P2';
    else prios[id] = '-';
  });

  function toggleCard(head) {
    head.closest('.card').classList.toggle('open');
  }

  function pick(btn) {
    const group = btn.closest('.opt-list').dataset.group;
    btn.closest('.opt-list').querySelectorAll('.opt').forEach(opt => opt.classList.remove('picked'));
    btn.classList.add('picked');
    const label = btn.querySelector('span:nth-child(2)').textContent.trim();
    state[group] = { value: btn.dataset.val, label };
    btn.closest('.card').classList.add('resolved');
    const indicator = document.getElementById('ci-' + group);
    if (indicator) indicator.classList.add('done');
    refresh();
  }

  function refresh() {
    const count = Object.keys(state).length;
    document.getElementById('g-count').textContent = count + ' / ' + TOTAL;
    document.getElementById('g-fill').style.width = (TOTAL ? count / TOTAL * 100 : 0) + '%';
    const exportBtn = document.getElementById('btn-go');
    const copyBtn = document.getElementById('btn-copy-json');
    if (count === TOTAL && TOTAL > 0) {
      exportBtn.disabled = false;
      exportBtn.classList.add('live');
      exportBtn.textContent = 'Export decision results';
      copyBtn.disabled = false;
      copyBtn.classList.add('live');
    } else {
      exportBtn.disabled = true;
      exportBtn.classList.remove('live');
      exportBtn.textContent = (TOTAL - count) + ' decisions remaining';
      copyBtn.disabled = true;
      copyBtn.classList.remove('live');
    }
  }

  function collectMemos() {
    const memos = {};
    document.querySelectorAll('textarea[data-memo]').forEach(textarea => {
      const value = textarea.value.trim();
      if (value) memos[textarea.dataset.memo] = value;
    });
    return memos;
  }

  function buildJsonPayload() {
    const memos = collectMemos();
    return JSON.stringify({
      title: ISSUE_ID + ' decision results',
      exported_at: new Date().toISOString(),
      branch: BRANCH,
      decisions: Object.entries(state).map(([id, selected]) => ({
        id,
        priority: prios[id],
        title: titles[id],
        selected: selected.value,
        selected_label: selected.label,
        memo: memos[id] || null
      }))
    }, null, 2);
  }

  document.getElementById('btn-copy-json').addEventListener('click', async () => {
    const payload = buildJsonPayload();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(payload);
      } else {
        const textarea = document.createElement('textarea');
        textarea.value = payload;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }
      toast('JSON copied to clipboard (' + payload.length.toLocaleString() + ' characters)');
    } catch (error) {
      toast('Copy failed: ' + (error.message || error));
    }
  });

  document.querySelectorAll('.fmt-opt').forEach(button => {
    button.addEventListener('click', () => {
      document.querySelectorAll('.fmt-opt').forEach(item => item.classList.remove('on'));
      button.classList.add('on');
      fmt = button.dataset.f;
    });
  });

  document.getElementById('btn-go').addEventListener('click', () => {
    const now = new Date();
    const day = now.toISOString().split('T')[0];
    const time = now.toTimeString().split(' ')[0].replace(/:/g, '');
    const memos = collectMemos();
    let content;
    let filename;
    let mime;

    if (fmt === 'json') {
      content = buildJsonPayload();
      filename = `${ISSUE_ID}_decisions_${day}_${time}.json`;
      mime = 'application/json';
    } else {
      const lines = [];
      lines.push('# ' + ISSUE_ID + ' decision results', '');
      lines.push('- **Exported at**: ' + now.toLocaleString('en-US'));
      lines.push('- **Branch**: `' + BRANCH + '`', '', '---', '');
      const groups = Array.from(document.querySelectorAll('.pri-section')).map(section => {
        const heading = section.querySelector('.pri-tag') ? section.querySelector('.pri-tag').textContent.trim() : '';
        const ids = Array.from(section.querySelectorAll('.card[data-key]')).map(card => card.dataset.key);
        return { heading, ids };
      });
      for (const group of groups) {
        lines.push('## ' + group.heading, '');
        for (const id of group.ids) {
          const selected = state[id];
          lines.push('### ' + titles[id], '');
          lines.push('- **Choice**: ' + selected.value);
          lines.push('- **Content**: ' + selected.label);
          if (memos[id]) lines.push('- **Memo**: ' + memos[id]);
          lines.push('');
        }
      }
      lines.push('---', '');
      lines.push('> Persist these decisions into the final decision JSON before downstream implementation.');
      content = lines.join('\n');
      filename = `${ISSUE_ID}_decisions_${day}_${time}.md`;
      mime = 'text/markdown';
    }

    const blob = new Blob([content], { type: mime + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    toast(filename + ' downloaded');
  });

  function toast(message) {
    const element = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = message;
    element.classList.add('show');
    setTimeout(() => element.classList.remove('show'), 3200);
  }

  const spy = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (entry.isIntersecting) {
        document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
        const active = document.querySelector('.nav-link[data-id="' + entry.target.id + '"]');
        if (active) active.classList.add('active');
      }
    }
  }, { rootMargin: '-15% 0px -65% 0px' });

  document.querySelectorAll('.card[data-key]').forEach(card => spy.observe(card));
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', event => {
      event.preventDefault();
      const id = link.dataset.id;
      const card = document.getElementById(id);
      if (!card) return;
      if (!card.classList.contains('open')) card.classList.add('open');
      const top = window.pageYOffset + card.getBoundingClientRect().top - 24;
      window.scrollTo({ top, behavior: 'smooth' });
      document.querySelectorAll('.nav-link').forEach(item => item.classList.remove('active'));
      link.classList.add('active');
      history.replaceState(null, '', '#' + id);
    });
  });

  refresh();
</script>
</body>
</html>
