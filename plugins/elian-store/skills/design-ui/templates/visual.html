<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual Prototype</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --ink: #17202a;
      --muted: #64748b;
      --line: #d7dee8;
      --primary: #1263d8;
      --primary-ink: #ffffff;
      --accent: #0f766e;
      --danger: #b42318;
      --shadow: 0 8px 28px rgba(15, 23, 42, .10);
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    button, select {
      font: inherit;
      min-height: 44px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(255, 255, 255, .94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    select, .btn {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      padding: 8px 12px;
    }
    .btn {
      cursor: pointer;
    }
    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-ink);
    }
    .btn.ghost {
      background: transparent;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 18px 72px;
    }
    .page-mock { display: none; }
    .page-mock.active { display: block; }
    .hero {
      display: grid;
      grid-template-columns: 1.4fr .8fr;
      gap: 18px;
      align-items: stretch;
      margin-bottom: 18px;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }
    h1, h2, h3 { margin: 0; }
    h1 { font-size: 30px; line-height: 1.2; }
    h2 { font-size: 24px; line-height: 1.25; margin-bottom: 8px; }
    h3 { font-size: 18px; margin-bottom: 8px; }
    p { margin: 8px 0 0; color: var(--muted); }
    .metric {
      display: grid;
      gap: 4px;
    }
    .metric strong {
      font-size: 30px;
      color: var(--ink);
    }
    .list {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
    }
    .row:hover { border-color: var(--primary); }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 8px;
      background: #ecfdf5;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }
    .danger { color: var(--danger); }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .state-box {
      margin-top: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      min-height: 128px;
    }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: none;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: var(--ink);
      color: #fff;
      box-shadow: var(--shadow);
    }
    .toast.show { display: block; }
    :focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 2px;
    }
    @media (max-width: 760px) {
      .hero { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <strong>Prototype mode</strong>
    <div class="controls">
      <label>Page
        <select id="pageSelect">
          <option value="page-1">page-1 Overview</option>
          <option value="page-2">page-2 Detail</option>
          <option value="page-3">page-3 Confirm</option>
        </select>
      </label>
      <label>State
        <select id="stateSelect">
          <option value="default">default</option>
          <option value="empty">empty</option>
          <option value="loading">loading</option>
          <option value="error">error</option>
        </select>
      </label>
    </div>
  </div>

  <main>
    <section class="page-mock" id="page-1">
      <div class="hero">
        <div class="panel">
          <h1>Overview</h1>
          <p>Entry page for scanning work, selecting an item, and starting the primary task.</p>
          <div class="actions">
            <button class="btn primary" data-go="page-3">Start primary action</button>
            <button class="btn ghost" id="toggleMask">Toggle masking</button>
          </div>
        </div>
        <div class="panel metric">
          <span>Selected items</span>
          <strong id="selectedCount">0</strong>
          <span class="badge">Ready</span>
        </div>
      </div>
      <div class="panel">
        <h2>Work Area</h2>
        <div class="state-box" data-state-area="page-1"></div>
        <div class="list" id="workList">
          <button class="row" data-select="Alpha case" data-go="page-2">
            <span><strong>Alpha case</strong><br><small>Click to inspect detail.</small></span>
            <span class="badge">Open</span>
          </button>
          <button class="row" data-select="Beta case" data-go="page-2">
            <span><strong>Beta case</strong><br><small>Click to inspect detail.</small></span>
            <span class="badge">Open</span>
          </button>
        </div>
      </div>
    </section>

    <section class="page-mock" id="page-2">
      <div class="panel">
        <h1>Detail</h1>
        <p>Selected item: <strong id="selectedName">None selected</strong></p>
        <div class="state-box" data-state-area="page-2"></div>
        <div class="actions">
          <button class="btn ghost" data-go="page-1">Back to overview</button>
          <button class="btn primary" data-go="page-3">Continue to confirm</button>
        </div>
      </div>
    </section>

    <section class="page-mock" id="page-3">
      <div class="panel">
        <h1>Confirm</h1>
        <p>Review the selected state before committing the action.</p>
        <div class="state-box" data-state-area="page-3"></div>
        <div class="actions">
          <button class="btn primary" id="confirmBtn">Confirm</button>
          <button class="btn ghost" data-go="page-1">Return to overview</button>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">Confirmed</div>

  <script>
    const state = {
      selectedName: '',
      selectedCount: 0,
      masked: false,
      viewState: 'default'
    };

    const pages = ['page-1', 'page-2', 'page-3'];
    const pageSelect = document.getElementById('pageSelect');
    const stateSelect = document.getElementById('stateSelect');
    const selectedName = document.getElementById('selectedName');
    const selectedCount = document.getElementById('selectedCount');
    const toast = document.getElementById('toast');

    function renderStateBox(area) {
      const value = state.viewState;
      if (value === 'loading') return '<strong>Loading</strong><p>Fetching current data...</p>';
      if (value === 'empty') return '<strong>No items</strong><p>There is nothing to act on right now.</p>';
      if (value === 'error') return '<strong class="danger">Error</strong><p>Data could not be loaded. Retry remains available.</p>';
      return '<strong>Default state</strong><p>Primary content is available and ready for action.</p>';
    }

    function showPage(id) {
      const page = pages.includes(id) ? id : 'page-1';
      document.querySelectorAll('.page-mock').forEach(el => el.classList.toggle('active', el.id === page));
      pageSelect.value = page;
      if (location.hash !== '#' + page) location.hash = page;
      render();
    }

    function render() {
      selectedName.textContent = state.selectedName || 'None selected';
      selectedCount.textContent = String(state.selectedCount);
      document.querySelectorAll('[data-state-area]').forEach(el => {
        el.innerHTML = renderStateBox(el.dataset.stateArea);
      });
      document.body.dataset.masked = state.masked ? 'true' : 'false';
    }

    document.addEventListener('click', (event) => {
      const target = event.target.closest('[data-go], [data-select], #toggleMask, #confirmBtn');
      if (!target) return;
      if (target.dataset.select) {
        state.selectedName = target.dataset.select;
        state.selectedCount = 1;
      }
      if (target.id === 'toggleMask') {
        state.masked = !state.masked;
        target.textContent = state.masked ? 'Masking on' : 'Toggle masking';
      }
      if (target.id === 'confirmBtn') {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1600);
      }
      if (target.dataset.go) showPage(target.dataset.go);
      render();
    });

    pageSelect.addEventListener('change', () => showPage(pageSelect.value));
    stateSelect.addEventListener('change', () => {
      state.viewState = stateSelect.value;
      render();
    });
    window.addEventListener('hashchange', () => showPage(location.hash.replace('#', '')));
    showPage(location.hash.replace('#', '') || 'page-1');
  </script>
</body>
</html>
