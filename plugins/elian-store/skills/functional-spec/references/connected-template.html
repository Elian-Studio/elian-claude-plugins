<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- SCREEN --> — 와이어프레임 ↔ 기능명세 연결</title>
<!--
  connected-template.html — /functional-spec Phase 5 wireframe↔spec split view.

  How to use:
  - Left .wire  = paste the ACTUAL wireframe markup for this screen (from the mockup).
    On every element that maps to a spec row, add class="anchor" data-n="N" and a
    visible <span class="mk" data-n="N">N</span> marker. Use class="anchor newbe" +
    <span class="mk newbe"> for new-BE elements (green).
  - Right .spec = the ② functional decomposition table. Each <tr class="row" data-n="N">
    must reuse the SAME N as its wireframe element. Add class="newbe" for new-BE rows.
  - The numbers N are the contract: hovering either side highlights the matching pair.
    A drifted N is a broken anchor — keep them one-to-one with the .md ② table.
  - tokens.css: link the wireframe's own tokens (e.g. ../mockups/tokens.css) or this
    skill's references/tokens.css copied alongside the output.
-->
<link rel="stylesheet" href="../mockups/tokens.css">
<style>
  body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#eef0f4;color:#1a1d24;}
  .top{padding:16px 24px;background:#fff;border-bottom:1px solid var(--line);}
  .top h1{font-size:18px;margin:0 0 4px;}
  .top p{margin:0;font-size:12.5px;color:var(--muted);}
  .split{display:grid;grid-template-columns:1.15fr 1fr;gap:0;align-items:start;}
  .wire{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;border-right:1px solid var(--line);background:#f4f6f9;}
  .spec{padding:18px 20px 80px;overflow:auto;}
  /* number markers on the wireframe side */
  .mk{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 4px;
     background:#e8590c;color:#fff;font-size:11px;font-weight:800;border-radius:10px;vertical-align:middle;
     margin:0 4px;box-shadow:0 0 0 2px #fff;cursor:pointer;position:relative;z-index:2;font-family:ui-monospace,monospace;}
  .mk.newbe{background:#2f9e63;}
  .anchor{position:relative;outline-offset:2px;transition:.12s;border-radius:6px;}
  .anchor.hot{outline:2px dashed #e8590c;background:#fff4ec;}
  .anchor.hot.newbe{outline-color:#2f9e63;background:#eafaf0;}
  /* spec table */
  .spec h2{font-size:15px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line);}
  table{border-collapse:collapse;width:100%;font-size:12.5px;}
  th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;}
  th{background:var(--bg);font-weight:700;position:sticky;top:0;}
  tr.row{cursor:pointer;}
  tr.row:hover,tr.row.hot{background:#fff4ec;}
  tr.row.newbe:hover,tr.row.newbe.hot{background:#eafaf0;}
  .num{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 4px;background:#e8590c;color:#fff;font-size:11px;font-weight:800;border-radius:10px;font-family:ui-monospace,monospace;}
  .num.newbe{background:#2f9e63;}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;}
  .tag.ok{background:#eafaf0;color:#2f9e63;} .tag.new{background:#fdeee2;color:#e8590c;} .tag.ui{background:#eef1f6;color:#5b6472;}
  .legend{font-size:12px;color:var(--muted);margin:0 0 14px;}
  .legend b{color:#1a1d24;}
</style>
</head>
<body>
<div class="top">
  <h1><!-- SCREEN --> — 와이어프레임 ↔ 기능명세 연결</h1>
  <p>좌: 실제 와이어프레임(<code><!-- mockup path --></code>) · 우: 기능명세 표.
     <b>같은 번호 = 같은 요소.</b> 행/마커에 커서를 올리면 서로 강조됩니다.
     <span class="tag new">주황</span> 일반 · <span class="tag ok">초록</span> 신규 BE.</p>
</div>
<div class="split">
  <!-- ================= LEFT: real wireframe + numbered markers ================= -->
  <div class="wire">
    <!-- Paste the actual wireframe markup here.
         Wrap each mapped element:  class="anchor" data-n="N"  and place
         <span class="mk" data-n="N">N</span> next to it. Use .newbe for new-BE elements. -->
  </div>

  <!-- ================= RIGHT: functional decomposition (same numbers) ================= -->
  <div class="spec">
    <h2>기능 분해 — 완료 판정은 실서버 왕복 기준</h2>
    <p class="legend"><span class="tag ok">기존</span> 이미 있는 데이터/기능 ·
       <span class="tag new">신규 BE</span> 새 집계 · <span class="tag ui">UI</span> 클라 상태</p>
    <table>
      <thead><tr><th style="width:26px">#</th><th>요소</th><th>기능(동작)</th><th>데이터·완료 판정</th><th style="width:44px">구분</th></tr></thead>
      <tbody>
        <!-- One <tr class="row" data-n="N"> per element. Example:
        <tr class="row" data-n="1"><td><span class="num">1</span></td><td>키워드 검색</td>
          <td>이름·연락처·차트번호로 서버 재조회</td>
          <td><code>GET /patient</code> search.keyword → 서버 필터 rows</td>
          <td><span class="tag ok">기존</span></td></tr>
        <tr class="row newbe" data-n="11"><td><span class="num newbe">11</span></td><td>방문 횟수</td>
          <td>완료 진료 건수 표시</td>
          <td><b>신규</b> consult_v2 COUNT → visitCount:int</td>
          <td><span class="tag new">신규 BE</span></td></tr>
        -->
      </tbody>
    </table>
    <p class="legend" style="margin-top:14px"><!-- one-line summary: N elements, M new BE --></p>
  </div>
</div>
<script>
  function hot(n,on){
    document.querySelectorAll('[data-n="'+n+'"]').forEach(el=>{
      if(el.classList.contains('anchor')||el.classList.contains('row')) el.classList.toggle('hot',on);
    });
  }
  document.querySelectorAll('[data-n]').forEach(el=>{
    const n=el.getAttribute('data-n');
    el.addEventListener('mouseenter',()=>hot(n,true));
    el.addEventListener('mouseleave',()=>hot(n,false));
  });
</script>
</body>
</html>
